version: "3.9"
services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  processor:
    build: ./processor
    depends_on:
      - redis
    volumes:
      - ./processor:/app
    working_dir: /app
    command: python firehose_processor.py

  publisher:
    build: ./publisher
    depends_on:
      - redis
    volumes:
      - ./publisher:/app
    working_dir: /app
    command: python firehose_publisher.py
